[project]
name = "online-bookshelf-backend"
version = "0.1.0"
description = "FastAPI backend for the Online Bookshelf MVP"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.2",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.2",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "ruff>=0.6.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
